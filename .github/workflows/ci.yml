name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json "packageManager" — do not set `version`
      # here as well, the action errors on a double declaration.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: better-sqlite3 loads without a build step
        # pnpm 10 blocks dependency build scripts by default, and consumers
        # install sim-core with --ignore-scripts in restricted CI. better-sqlite3
        # ships prebuilt binaries in its tarball, so this must work anyway — if
        # it ever stops, every consumer's install breaks, not just ours.
        run: node -e "const D=require('better-sqlite3'); new D(':memory:').exec('select 1'); console.log('ok')"

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Committed dist is complete
        # dist/ is committed so `github:` installs need no build step.
        run: |
          for f in \
            dist/index.js \
            dist/index.d.ts \
            dist/docs/docs.service.js \
            dist/storage/storage.service.js \
            dist/webhooks/verify.js \
            dist/public/index.html \
            dist/public/assets/admin.js
          do
            test -f "$f" || { echo "::error::missing $f — run 'pnpm build' and commit dist/"; exit 1; }
          done

      - name: Build (library + admin SPA)
        run: pnpm run build

      - name: Warn if committed dist drifted
        # Advisory only: bundler output is not guaranteed byte-identical across
        # platforms, so a diff here is a prompt to look, not an automatic failure.
        continue-on-error: true
        run: |
          if ! git diff --quiet -- dist; then
            echo "::warning::dist/ differs from a fresh build. Run 'pnpm build' and commit the result."
            git diff --stat -- dist
          fi

      - name: Test
        run: pnpm run test
